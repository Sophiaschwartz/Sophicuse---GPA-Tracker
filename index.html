<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sophicuse GPA Tracker</title>
<meta name="description" content="Track your course grades, see what you need on your next assignments, and project your semester and cumulative GPA. Your data stays on your device.">
<meta name="theme-color" content="#000E54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sophicuse">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F76900; --orange-deep:#C94A00; --orange-soft:#FFEBDD;
    --navy:#000E54; --navy-soft:#E6E9F4;
    --paper:#F4F6FB; --line:#D8DCEA; --text:#262C4A; --muted:#5E6688;
    --good:#1F7A4D; --warn:#B3261E;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--paper);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--navy) 248px,var(--paper) 248px)}

  nav.side{background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .brand{padding:0 8px 16px;border-bottom:4px solid var(--orange);margin-bottom:12px}
  .brand .nm{font-stretch:72%;font-weight:850;font-size:30px;line-height:1;letter-spacing:.2px}
  .brand .tag{color:#B9C0E0;font-size:13px;margin-top:5px}
  .navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:#DDE1F2;cursor:pointer}
  .navbtn:hover{background:rgba(255,255,255,.07)}
  .navbtn.on{background:#fff;color:var(--navy)}
  .navbtn .t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  .navbtn .t b{font-stretch:85%;font-weight:750;font-size:15px}
  .navbtn .t small{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .chip{font-stretch:75%;font-weight:800;font-size:15px;min-width:34px;text-align:center;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.12);color:#fff}
  .navbtn.on .chip{background:var(--orange)}
  .chip.empty{opacity:.6;font-stretch:100%;font-weight:600;font-size:11.5px}
  .navbtn.add{color:#FFB27A}
  .navgroup{font-size:12px;color:#8F98C4;padding:14px 10px 4px}
  .savestate{margin-top:auto;padding:14px 10px 0;font-size:12px;color:#8F98C4}

  main{padding:28px clamp(16px,4vw,48px) 80px;max-width:1120px;width:100%}
  h1,h2,h3{color:var(--navy);margin:0}
  h1{font-stretch:72%;font-weight:850;font-size:44px;line-height:1}
  h2{font-stretch:80%;font-weight:800;font-size:24px;line-height:1.15}
  h3{font-weight:700;font-size:17px}
  .sub{color:var(--muted);margin:6px 0 0}
  section.block{margin-top:30px}
  .bhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}

  .hero{background:var(--navy);color:#fff;border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px;margin-top:20px;border-bottom:6px solid var(--orange)}
  .hero .big{font-stretch:62%;font-weight:900;font-size:84px;line-height:.9;letter-spacing:-1px}
  .hero .big.o{color:var(--orange)}
  .hero .big.none{font-stretch:75%;font-weight:800;font-size:40px;line-height:1.1;color:#C4CAE6;padding-top:24px}
  .hero .lbl{color:#C4CAE6;font-size:14px;margin-top:8px}
  .hero .fine{color:#8F98C4;font-size:12.5px;margin-top:2px}

  .courses{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .crow{display:grid;grid-template-columns:130px 1fr 90px 64px;gap:16px;align-items:center;padding:14px 18px;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
  .crow:first-child{border-top:0}
  .crow:hover{background:#FAFBFE}
  .crow .code{font-stretch:75%;font-weight:800;font-size:20px;color:var(--navy);overflow-wrap:anywhere}
  .crow .cname{font-size:13px;color:var(--muted)}
  .crow .pct{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .crow .let{font-stretch:70%;font-weight:900;font-size:26px;color:var(--orange-deep);text-align:right}
  .crow .let.empty{grid-column:span 2;white-space:nowrap;color:#8F96B4;font-stretch:100%;font-weight:600;font-size:13px}
  .track{position:relative;height:12px;background:var(--navy-soft);border-radius:6px;margin-top:6px}
  .track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--orange);border-radius:6px}
  .track .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:#9AA2C6}
  .track .tgt{position:absolute;top:-5px;width:4px;height:22px;background:var(--navy);border-radius:2px}
  .tracklabels{position:relative;height:14px;font-size:10.5px;color:var(--muted)}
  .tracklabels span{position:absolute;transform:translateX(-50%)}
  .nodata{font-size:13px;color:var(--muted);margin-top:4px}

  .sched{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
  .sgrid{display:grid;min-width:600px}
  .sday{font-weight:700;color:var(--navy);text-align:center;padding-bottom:6px;font-size:14px}
  .scol{position:relative;border-left:1px solid var(--line)}
  .stimes{position:relative}
  .stimes span{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-50%);white-space:nowrap}
  .shline{position:absolute;left:0;right:0;border-top:1px dashed #E7E9F2}
  .sblk{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.25;background:var(--navy-soft);border:0;border-left:4px solid var(--navy);color:var(--navy);overflow:hidden;cursor:pointer;text-align:left}
  .sblk.alt{background:var(--orange-soft);border-left-color:var(--orange)}
  .sblk b{display:block;font-size:12.5px}

  .meta{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:10px;font-size:13.5px;color:var(--muted)}
  .meta span b{color:var(--text);font-weight:600}
  .stats{display:grid;grid-template-columns:1fr 1.5fr;margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .stat-now{background:var(--navy);color:#fff;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
  .stat-now .row{display:flex;align-items:flex-end;gap:14px}
  .stat-now .big{font-stretch:62%;font-weight:900;font-size:78px;line-height:.85}
  .stat-now .big.none{font-stretch:75%;font-weight:800;font-size:40px;line-height:1.1;color:#C4CAE6}
  .stat-now .letter{font-stretch:62%;font-weight:900;font-size:48px;line-height:.9;color:var(--orange)}
  .stat-now .lbl{color:#C4CAE6;font-size:13.5px}
  .progress{height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;margin-top:6px}
  .progress i{display:block;height:100%;background:var(--orange)}
  .stat-need{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
  .needline{font-size:16px}
  .needline .n{font-stretch:70%;font-weight:900;font-size:40px;color:var(--orange-deep);line-height:1;display:block;margin:4px 0}
  .needline .n.ok{color:var(--good)} .needline .n.bad{color:var(--warn)}
  .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
  select,input[type=number],input[type=text],input[type=time],textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
  input[type=number]{width:78px;font-variant-numeric:tabular-nums}
  textarea{width:100%;min-height:90px;resize:vertical}
  input.wide{width:100%}
  .whatif{border-top:1px solid var(--line);padding-top:12px}
  .whatif b{color:var(--navy)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;align-items:center}
  .btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
  .btn:hover{background:var(--navy-soft)}
  .btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
  .btn.pri:hover{background:var(--orange-deep);border-color:var(--orange-deep)}
  .btn.ghost{border-color:transparent;color:var(--muted);font-weight:500}
  .btn.danger{border-color:var(--warn);color:var(--warn)}
  .btn.danger:hover{background:#FDE7E4}
  .btn.sm{padding:4px 10px;font-size:13px}
  .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:5px}
  .x:hover{background:#FDE7E4;color:var(--warn)}

  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .panel + .panel{margin-top:14px}
  .panel .res{font-stretch:70%;font-weight:900;font-size:38px;color:var(--orange-deep);line-height:1.05;margin-top:8px}
  .panel p{margin:6px 0 0;color:var(--muted);font-size:14px}
  .notes{white-space:pre-wrap;margin:8px 0 0}
  .flag{background:var(--orange-soft);border-left:4px solid var(--orange);padding:10px 14px;border-radius:8px;margin-top:14px;font-size:14px}

  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
  .form label,.fld{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted);font-weight:600}
  .form label input,.form label select{width:100%;font-weight:400;color:var(--text)}
  .form .full{grid-column:1/-1}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .days label{flex-direction:row;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;color:var(--navy);cursor:pointer;font-weight:600}
  .days input{accent-color:var(--orange);width:16px;height:16px}
  .req{color:var(--orange-deep)}

  .presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .presets button{border:1px dashed var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
  .presets button:hover{background:var(--navy-soft);border-style:solid}
  .wsum{font-size:13.5px;color:var(--muted);margin-top:10px}

  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:18px}
  .cat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
  .cat .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .cat .share{font-size:13px;color:var(--muted)}
  .cat .avg{font-stretch:72%;font-weight:850;font-size:26px;color:var(--navy);line-height:1;text-align:right;white-space:nowrap}
  .cat .avg.empty{color:#8F96B4;font-stretch:100%;font-weight:600;font-size:13px;padding-top:4px}
  .rule{font-size:12.5px;color:var(--orange-deep);margin-top:2px}
  table.items{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  table.items td{padding:4px 2px;border-top:1px solid #EEF0F6;vertical-align:middle}
  table.items td.lab{width:100%}
  table.items td.pc{text-align:right;color:var(--muted);white-space:nowrap;min-width:48px;font-variant-numeric:tabular-nums}
  table.items td.of{white-space:nowrap;color:var(--muted);padding-left:6px}
  table.items input[type=number]{width:66px}
  .dropped td{opacity:.45}
  .editgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
  .editgrid label{display:flex;flex-direction:column;gap:3px}
  .editgrid input,.editgrid select{width:100%}
  .empty-state{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:28px;margin-top:18px;text-align:center}
  .empty-state p{max-width:520px;margin:8px auto 14px;color:var(--muted)}

  .scale{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .scale label{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-weight:700;color:var(--navy);font-size:14px}
  .scale input{width:62px}

  table.gpa{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14.5px}
  table.gpa th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:10px 14px;background:#FAFBFE;border-bottom:1px solid var(--line)}
  table.gpa td{padding:9px 14px;border-top:1px solid #EEF0F6}
  table.gpa .num{text-align:right;font-variant-numeric:tabular-nums}
  table.gpa tfoot td{font-weight:800;color:var(--navy);background:#FAFBFE}
  table.gpa input[type=text]{width:100%}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .twocol > .panel + .panel{margin-top:0}
  .tablewrap{overflow-x:auto}

  .welcome h1{font-size:64px}
  .steps{counter-reset:s;display:flex;flex-direction:column;gap:16px;margin-top:24px}
  .step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px 20px 64px;position:relative}
  .step::before{counter-increment:s;content:counter(s);position:absolute;left:18px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;display:grid;place-items:center;font-stretch:80%;font-size:17px}
  .privacy{font-size:13px;color:var(--muted);margin-top:18px}

  @media (max-width:860px){
    .app{grid-template-columns:1fr;background:var(--paper)}
    nav.side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px;padding-top:max(10px,env(safe-area-inset-top));gap:6px;z-index:5}
    .brand,.navgroup,.savestate{display:none}
    .navbtn{flex:0 0 auto;width:auto}
    .navbtn .t small{display:none}
    .hero{grid-template-columns:1fr;gap:14px}
    .hero .big{font-size:64px}
    .stats{grid-template-columns:1fr}
    .crow{grid-template-columns:90px 1fr 56px;gap:10px}
    .crow .pct{display:none}
    .crow .let.empty{grid-column:auto;white-space:normal}
    .twocol{grid-template-columns:1fr}
    .editgrid{grid-template-columns:1fr}
    h1{font-size:36px}
    .welcome h1{font-size:44px}
    main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  }
  @media (prefers-reduced-motion:no-preference){ .track .fill,.progress i{transition:width .35s ease} }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<input type="file" id="importfile" accept="application/json,.json" hidden>

<script>
/* =========================================================
   Sophicuse GPA Tracker
   All data is saved in this browser (localStorage). Nothing is sent anywhere.
   ========================================================= */

const GP = {"A":4,"A-":3.667,"B+":3.333,"B":3,"B-":2.667,"C+":2.333,"C":2,"C-":1.667,"D":1,"F":0};
const LETTERS = Object.keys(GP);
const STD_SCALE = [["A",93],["A-",90],["B+",87],["B",83],["B-",80],["C+",77],["C",73],["C-",70],["D",60],["F",0]];
const DAYN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const KEY = "sophicuse-gpa-tracker-v1";

const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
const items = (prefix,n,max)=>Array.from({length:n},(_,i)=>({label:`${prefix} ${i+1}`,earned:"",max}));
const one = (label,max=100)=>[{label,earned:"",max}];

const PRESETS = {
  "Exams":        ()=>({name:"Exams",weight:40,kind:"items",items:items("Exam",2,100)}),
  "Midterm":      ()=>({name:"Midterm",weight:25,kind:"items",items:one("Midterm")}),
  "Final exam":   ()=>({name:"Final exam",weight:30,kind:"items",items:one("Final exam")}),
  "Quizzes":      ()=>({name:"Quizzes",weight:10,kind:"items",items:items("Quiz",5,10)}),
  "Homework":     ()=>({name:"Homework",weight:20,kind:"items",items:items("HW",5,10)}),
  "Papers":       ()=>({name:"Papers",weight:20,kind:"items",items:items("Paper",2,100)}),
  "Labs":         ()=>({name:"Labs",weight:15,kind:"items",items:items("Lab",5,10)}),
  "Project":      ()=>({name:"Project",weight:20,kind:"items",items:one("Project")}),
  "Participation":()=>({name:"Participation",weight:10,kind:"items",items:one("Participation %")}),
  "Running total":()=>({name:"Daily work",weight:10,kind:"tally",earned:"",possible:"",total:50}),
  "Custom":       ()=>({name:"New category",weight:10,kind:"items",items:one("Score")})
};

function newCourse(info){
  return Object.assign({id:uid(), code:"", name:"", credits:3, prof:"", room:"", days:[], start:"", end:"",
    notes:"", target:"A", whatif:"", absences:null, scale:clone(STD_SCALE), categories:[]}, info);
}
function freshState(){
  return {v:1, onboarded:false, view:"welcome", edit:false, profile:{name:"",term:""}, past:[], courses:[], override:{}, targetCum:""};
}
let S = freshState();

/* ---------- Storage ---------- */
let storageOK = true, saveTimer = null;
function setSave(msg){ const el=document.getElementById("savestate"); if(el) el.textContent=msg; }
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ const copy=Object.assign({},S,{edit:false}); localStorage.setItem(KEY, JSON.stringify(copy)); storageOK=true; setSave("Saved on this device"); }
    catch(e){ storageOK=false; setSave("Can't save in this browser. Use Settings to download a backup."); }
  },300);
}
function sanitize(d){
  if(!d || typeof d!=="object" || !Array.isArray(d.courses)) return null;
  const s=Object.assign(freshState(), d);
  s.profile=Object.assign({name:"",term:""}, d.profile||{});
  s.past=Array.isArray(d.past)?d.past:[];
  s.override=d.override||{};
  s.courses=d.courses.map(c=>{ const n=newCourse(c); if(!Array.isArray(n.scale)||!n.scale.length) n.scale=clone(STD_SCALE); if(!Array.isArray(n.categories)) n.categories=[]; if(!Array.isArray(n.days)) n.days=[]; return n; });
  s.edit=false;
  if(s.view!=="welcome" && s.view!=="overview" && s.view!=="gpa" && s.view!=="settings" && s.view!=="new" && !s.courses.find(c=>c.id===s.view)) s.view="overview";
  return s;
}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const s=sanitize(JSON.parse(raw)); if(s) S=s; } }
  catch(e){ storageOK=false; }
  if(!S.onboarded && S.courses.length) S.onboarded=true;
  if(!S.onboarded) S.view="welcome";
}

/* ---------- Grade math ---------- */
const isNum = v => v!=="" && v!==null && v!==undefined && !isNaN(parseFloat(v));
const num = v => parseFloat(v);
const graded = it => isNum(it.earned) && num(it.max)>0;
const getC = id => S.courses.find(c=>c.id===id);

function parseRank(cat){
  if(cat.kind!=="items" || cat.rank===undefined || cat.rank===null || String(cat.rank).trim()==="") return null;
  const w=String(cat.rank).split(/[,\s]+/).map(Number).filter(x=>!isNaN(x)&&x>=0);
  return w.length && w.some(x=>x>0) ? w : null;
}
function pick(list, cat){
  if(!list.length) return null;
  const rw=parseRank(cat);
  if(rw){
    // Highest score gets the first weight, next highest the second, and so on.
    // With only some scores in, use the first weights for the scores you have.
    const p=list.map(x=>x.e/x.m).sort((a,b)=>b-a);
    let t=0,ws=0; p.forEach((v,i)=>{const w=rw[i]??0; t+=v*w; ws+=w;});
    return ws>0 ? t/ws : p.reduce((a,v)=>a+v,0)/p.length;
  }
  let use=list;
  const keep=parseInt(cat.keep);
  if(keep>0 && list.length>keep) use=[...list].sort((a,b)=>b.e/b.m-a.e/a.m).slice(0,keep);
  const E=use.reduce((a,x)=>a+x.e,0), M=use.reduce((a,x)=>a+x.m,0); return M>0?E/M:null;
}
function catNow(cat){
  if(cat.kind==="tally") return (isNum(cat.possible)&&num(cat.possible)>0&&isNum(cat.earned))? num(cat.earned)/num(cat.possible):null;
  return pick(cat.items.filter(graded).map(it=>({e:num(it.earned),m:num(it.max)})), cat);
}
function catWith(cat,x){
  if(cat.kind==="tally"){
    const T=num(cat.total)||0; if(T<=0) return x;
    const P=isNum(cat.possible)?Math.min(num(cat.possible),T):0, E=isNum(cat.earned)?num(cat.earned):0;
    return (E + x*(T-P))/T;
  }
  const list=cat.items.filter(it=>num(it.max)>0).map(it=>({e:graded(it)?num(it.earned):x*num(it.max), m:num(it.max)}));
  const r=pick(list,cat); return r===null?x:r;
}
function catDone(cat){
  if(cat.kind==="tally"){ const T=num(cat.total)||0; return T>0&&isNum(cat.possible)?Math.min(1,num(cat.possible)/T):0; }
  const M=cat.items.reduce((a,it)=>a+(num(it.max)||0),0); if(!M) return 0;
  return cat.items.filter(graded).reduce((a,it)=>a+num(it.max),0)/M;
}
const totalW = c => c.categories.reduce((a,k)=>a+(num(k.weight)||0),0);
function penalty(c){
  const a=c.absences; if(!a || !isNum(a.count)) return 0;
  return Math.max(0, num(a.count)-(num(a.free)||0)) * ((num(a.per)||0)/100);
}
function courseNow(c){
  let t=0,w=0; c.categories.forEach(k=>{const v=catNow(k), wt=num(k.weight)||0; if(v!==null&&wt>0){t+=v*wt; w+=wt;}});
  return w>0?Math.max(0,t/w-penalty(c)):null;
}
function courseWith(c,x){ const W=totalW(c); if(!W) return null; return Math.max(0,c.categories.reduce((a,k)=>a+catWith(k,x)*(num(k.weight)||0),0)/W-penalty(c)); }
function courseDone(c){ const W=totalW(c); if(!W) return 0; return c.categories.reduce((a,k)=>a+catDone(k)*(num(k.weight)||0),0)/W; }
function cutoff(c,L){ const r=c.scale.find(s=>s[0]===L); return r&&isNum(r[1])?num(r[1])/100:null; }
function letterOf(c,frac){ if(frac===null||frac===undefined) return null; const p=frac*100+1e-9; for(const [L,m] of c.scale){ if(isNum(m) && p>=num(m)) return L; } return "F"; }
function needed(c,L){
  const T=cutoff(c,L); if(T===null||!totalW(c)) return {state:"none"};
  if(courseDone(c)>=0.9999) return {state:"done"};
  if(courseWith(c,0)>=T-1e-9) return {state:"locked"};
  if(courseWith(c,1.5)<T-1e-9) return {state:"out", best:courseWith(c,1)};
  let lo=0,hi=1.5; for(let i=0;i<50;i++){const m=(lo+hi)/2; if(courseWith(c,m)>=T-1e-9) hi=m; else lo=m;}
  return hi>1+1e-6 ? {state:"out", best:courseWith(c,1)} : {state:"ok", x:Math.min(hi,1)};
}
const courseLetter = c => letterOf(c,courseNow(c));
const gpaLetter = c => S.override[c.id] || courseLetter(c);
function prior(){
  let cr=0,pts=0; S.past.forEach(p=>{ if(isNum(p.credits)&&isNum(p.gpa)){ cr+=num(p.credits); pts+=num(p.credits)*num(p.gpa);} });
  return {cr,pts,gpa:cr?pts/cr:null};
}
function semester(){
  let pts=0,cr=0; S.courses.forEach(c=>{const L=gpaLetter(c), k=num(c.credits)||0; if(L&&k>0){pts+=GP[L]*k; cr+=k;}});
  const P=prior(), allCr=P.cr+cr;
  return {pts,cr,gpa:cr?pts/cr:null, cum: allCr?(P.pts+pts)/allCr:null, termCredits:S.courses.reduce((a,c)=>a+(num(c.credits)||0),0)};
}
const f1 = v => v===null||v===undefined?"N/A":(v*100).toFixed(1)+"%";
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const an = L => /^[AF]/.test(L)?"an":"a";
function fmtTime(t){ if(!t) return ""; const [h,m]=t.split(":").map(Number); return `${((h+11)%12)+1}:${String(m).padStart(2,"0")} ${h>=12?"PM":"AM"}`; }
function meets(c){ if(!c.days.length) return ""; const d=[...c.days].sort().map(i=>DAYN[i]).join("/"); return c.start&&c.end? `${d} ${fmtTime(c.start)} to ${fmtTime(c.end)}`: d; }

function trackHTML(c,frac){
  const lo=60, span=40, pos=v=>Math.max(0,Math.min(100,(v-lo)/span*100));
  const ticks=c.scale.filter(s=>num(s[1])>lo).map(s=>`<i class="tick" style="left:${pos(num(s[1]))}%"></i>`).join("");
  const labels=c.scale.filter(s=>num(s[1])>lo && ["A","B","C"].includes(s[0])).map(s=>`<span style="left:${pos(num(s[1]))}%">${s[0]}</span>`).join("");
  const t=cutoff(c,c.target);
  return `<div class="track" role="img" aria-label="Current ${f1(frac)}, target ${esc(c.target)}">${ticks}
    ${frac!==null?`<i class="fill" style="width:${pos(frac*100)}%"></i>`:""}
    ${t!==null?`<i class="tgt" style="left:calc(${pos(t*100)}% - 2px)"></i>`:""}</div><div class="tracklabels">${labels}</div>`;
}
function scheduleHTML(){
  const withTimes=S.courses.filter(c=>c.days.length&&c.start&&c.end);
  if(!withTimes.length) return "";
  const toMin=t=>{const [h,m]=t.split(":").map(Number); return h*60+m;};
  let startH=Math.floor(Math.min(...withTimes.map(c=>toMin(c.start)))/60), endH=Math.ceil(Math.max(...withTimes.map(c=>toMin(c.end)))/60);
  if(endH-startH<4) endH=startH+4;
  const PX=50, H=(endH-startH)*PX, y=t=>(toMin(t)-startH*60)/60*PX;
  const used=new Set(withTimes.flatMap(c=>c.days)); const days=[1,2,3,4,5].concat([6,0].filter(d=>used.has(d)));
  const hours=[]; for(let h=startH;h<=endH;h++) hours.push(h);
  const fmtH=h=>`${((h+11)%12)+1} ${h>=12&&h<24?"PM":"AM"}`;
  const cols=days.map(d=>{
    const blocks=withTimes.filter(c=>c.days.includes(d)).map(c=>`<button class="sblk ${S.courses.indexOf(c)%2?"alt":""}" data-go="${c.id}" style="top:${y(c.start)}px;height:${Math.max(18,y(c.end)-y(c.start))}px"><b>${esc(c.code)}</b>${esc(c.room)}</button>`).join("");
    return `<div class="scol" style="height:${H}px">${hours.map(h=>`<i class="shline" style="top:${(h-startH)*PX}px"></i>`).join("")}${blocks}</div>`;}).join("");
  return `<section class="block"><div class="bhead"><h2>Weekly schedule</h2></div><div class="sched">
    <div class="sgrid" style="grid-template-columns:56px repeat(${days.length},minmax(100px,1fr))"><div></div>${days.map(d=>`<div class="sday">${DAYN[d]}</div>`).join("")}
    <div class="stimes" style="height:${H}px">${hours.map(h=>`<span style="top:${(h-startH)*PX}px">${fmtH(h)}</span>`).join("")}</div>${cols}</div></div></section>`;
}

function ruleText(k){
  const rw=parseRank(k);
  if(rw){ const tot=rw.reduce((a,b)=>a+b,0); const pct=rw.map(w=>+(w/tot*100).toFixed(1)+"%");
    const names=pct.map((p,i)=>i===0?`highest ${p}`:i===pct.length-1&&pct.length>1?`lowest ${p}`:`next ${p}`);
    return `Weighted by score: ${names.join(", ")}`; }
  const keep=parseInt(k.keep);
  if(k.kind==="items" && keep>0 && keep<k.items.length) return keep===k.items.length-1?"Lowest one dropped":`Best ${keep} of ${k.items.length} count`;
  if(k.kind==="tally") return "Enter your running total";
  return "";
}
function needHTML(c){

  return `<div class="needline">${tg}, average this on everything left:<span class="n">${(nd.x*100).toFixed(1)}%</span>${(100-done*100).toFixed(0)}% of the course is still ungraded.</div>`;
}

function keptSet(k){
  const keep=parseInt(k.keep);
  if(k.kind!=="items"||!(keep>0)||parseRank(k)) return null;
  const g=k.items.map((it,i)=>({i,it})).filter(o=>graded(o.it));
  if(g.length<=keep) return new Set(g.map(o=>o.i));
  return new Set(g.sort((a,b)=>num(b.it.earned)/num(b.it.max)-num(a.it.earned)/num(a.it.max)).slice(0,keep).map(o=>o.i));
}

      <label style="grid-column:1/-1">Weight by score, highest first (optional, e.g. 40, 40, 20)<input type="text" inputmode="decimal" value="${esc(k.rank??"")}" ${d} data-f="rank" placeholder="Leave blank to weight every score equally"></label>`:""}
      <span></span><span style="text-align:right"><button class="btn sm ghost" data-act="delcat" data-ci="${ci}">Delete category</button></span></div>`:"";
  return `<div class="cat"><div class="top"><div><h3>${esc(k.name)}</h3><div class="share" id="share-${ci}">${shareText(c,k)}</div>${rule?`<div class="rule">${rule}</div>`:""}</div>
      <div class="avg ${v===null?"empty":""}" id="avg-${ci}">${v===null?"Not graded yet":(v*100).toFixed(1)+"%"}</div></div>${edit}${body}</div>`;
}
function absText(c){
  const a=c.absences; if(!a) return "";
  const n=isNum(a.count)?num(a.count):0, free=num(a.free)||0, over=Math.max(0,n-free);
  return over?`${over} past your ${free} free: −${(over*(num(a.per)||0)).toFixed(0)}% on your overall grade (already applied)`
             :`${free-n} free absence${free-n===1?"":"s"} left before deductions`;
}
function wsumText(c){
  const W=totalW(c);
  if(!c.categories.length) return "";
  if(Math.abs(W-100)<1e-6) return "Weights add up to 100. Looks right.";
  return `Weights add up to ${+W.toFixed(2)}. That's fine for a points-based class, since each category's share is its weight divided by the total. For a percent-based class, they should add up to 100.`;
}
function renderCourse(c){
  const E=S.edit;
  const m=meets(c);
  document.getElementById("main").innerHTML=`
    <h1>${esc(c.code||"Untitled")}</h1>
    ${c.name?`<p class="sub" style="font-size:17px;color:var(--navy);font-weight:600">${esc(c.name)}</p>`:""}
    <div class="meta">${c.prof?`<span><b>Instructor</b> ${esc(c.prof)}</span>`:""}${m?`<span><b>Meets</b> ${esc(m)}</span>`:""}${c.room?`<span><b>Room</b> ${esc(c.room)}</span>`:""}<span><b>Credits</b> ${esc(c.credits)}</span></div>
    ${c.categories.length?`<div class="stats" id="stats">${statsHTML(c)}</div>`:""}
    ${!E&&c.notes?`<div class="panel" style="margin-top:16px"><h3>Syllabus notes</h3><p class="notes" style="color:var(--text)">${esc(c.notes)}</p></div>`:""}
    ${!E&&c.absences?`<div class="panel ctrl" style="margin-top:14px"><label for="abs"><b style="color:var(--navy)">Unexcused absences</b></label>
       <input type="number" inputmode="numeric" id="abs" min="0" step="1" value="${esc(c.absences.count)}" data-scope="abs" data-f="count" placeholder="0">
       <span id="absout" style="color:var(--muted)">${absText(c)}</span></div>`:""}
    <div class="toolbar">
      <button class="btn ${E?"pri":""}" data-act="toggleedit">${E?"Done editing":"Edit course and grading setup"}</button>
      <span class="sub" style="margin:0;font-size:13px">${E?"Changes save as you type. Scores you've entered stay put.":"Type a score in any box. Leave a box blank until it's graded."}</span></div>
    ${E?`<div class="panel" style="margin-top:16px"><h2>Course details</h2>${infoFields(c,true)}
        <label class="fld" style="margin-top:14px">Syllabus notes (late policy, exam dates, anything to remember)<textarea data-scope="course" data-f="notes" placeholder="Midterm is Nov 4. Quizzes can't be made up.">${esc(c.notes)}</textarea></label>
        <div style="margin-top:14px" class="ctrl"><label class="ctrl"><input type="checkbox" data-scope="abstoggle" ${c.absences?"checked":""}> This class takes points off for absences</label></div>
        ${c.absences?`<div class="form"><label>Free unexcused absences<input type="number" inputmode="numeric" min="0" step="1" value="${esc(c.absences.free)}" data-scope="abs" data-f="free"></label>
          <label>Percent off per extra absence<input type="number" inputmode="decimal" min="0" step="any" value="${esc(c.absences.per)}" data-scope="abs" data-f="per"></label></div>`:""}
      </div>
      <div class="panel"><h2>Grading breakdown</h2><p>Add a category for each line in the syllabus grading section, then set its weight. Tap to add:</p>
        <div class="presets">${Object.keys(PRESETS).map(p=>`<button data-act="preset" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>
        <div class="wsum" id="wsum">${wsumText(c)}</div></div>`:""}
    ${c.categories.length?`<div class="cats">${c.categories.map((k,ci)=>catHTML(c,k,ci)).join("")}</div>`
      :(!E?`<div class="empty-state"><h2>No grading breakdown yet</h2><p>Open your syllabus to the grading section and add a category for each part of the grade, like exams, quizzes, or participation.</p><button class="btn pri" data-act="toggleedit">Set up grading</button></div>`:"")}
    <section class="block"><div class="bhead"><h2>Letter grade cutoffs</h2><span class="sub" style="margin:0">${E?"Change these to match your syllabus.":"Minimum percent for each letter. Check your syllabus and edit if different."}</span></div>
      <div class="scale">${c.scale.map((s,si)=>`<label>${s[0]} ${E&&s[0]!=="F"?`<input type="number" inputmode="decimal" step="any" value="${esc(s[1])}" data-scope="scale" data-si="${si}" aria-label="${s[0]} minimum percent">`:`<span style="font-weight:500;color:var(--muted)">${esc(s[1])}%</span>`}</label>`).join("")}</div></section>
    ${E?`<section class="block"><button class="btn danger" data-act="delcourse">Delete this course</button></section>`:""}`;
}
function refreshCourse(c){
  const st=document.getElementById("stats");
  if(st){ const need=document.getElementById("need"); if(need) need.innerHTML=needHTML(c);
    const now=courseNow(c), L=letterOf(c,now), big=st.querySelector(".stat-now");
    if(big){ const done=courseDone(c);
      big.innerHTML=`<div><div class="lbl">Current grade</div><div class="row"><span class="big ${now===null?"none":""}">${now===null?"No grades yet":(now*100).toFixed(1)}</span><span class="letter">${L||""}</span></div></div>
        <div><div class="lbl">${(done*100).toFixed(0)}% of the course graded</div><div class="progress"><i style="width:${done*100}%"></i></div></div>`; }
    updateWhatif(c);
  }
  c.categories.forEach((k,ci)=>{
    const v=catNow(k), av=document.getElementById(`avg-${ci}`);
    if(av){ av.textContent=v===null?"Not graded yet":(v*100).toFixed(1)+"%"; av.classList.toggle("empty",v===null); }
    const sh=document.getElementById(`share-${ci}`); if(sh) sh.textContent=shareText(c,k);
    if(k.kind==="items"){ const kept=keptSet(k);
      k.items.forEach((it,ii)=>{ const pc=document.getElementById(`pc-${ci}-${ii}`); if(pc) pc.textContent=graded(it)?(num(it.earned)/num(it.max)*100).toFixed(0)+"%":"";
        const row=document.getElementById(`row-${ci}-${ii}`); if(row) row.classList.toggle("dropped",!!(kept&&graded(it)&&!kept.has(ii))); }); }
  });
  const ao=document.getElementById("absout"); if(ao) ao.textContent=absText(c);
  const ws=document.getElementById("wsum"); if(ws) ws.textContent=wsumText(c);
  renderSide();
}
function updateWhatif(c){ const out=document.getElementById("wiout"); if(!out) return; const wi=isNum(c.whatif)?courseWith(c,num(c.whatif)/100):null; out.textContent=wi===null?"…":`${f1(wi)} (${letterOf(c,wi)})`; }

/* ---------- GPA planner ---------- */
function reqText(){
  const sem=semester(), P=prior(), T=sem.termCredits, t=num(S.targetCum);
  if(!T) return "Add courses first";
  if(isNaN(t)) return "Enter a target";
  const req=(t*(P.cr+T)-P.pts)/T;
  return req>4?"Out of reach this term":req<=0?"Already safe":req.toFixed(3);
}
function renderGPA(){
  const sem=semester(), P=prior(), T=sem.termCredits;
  const rows=S.courses.map(c=>{const L=courseLetter(c), use=gpaLetter(c), k=num(c.credits)||0;
    return `<tr><td><b style="color:var(--navy)">${esc(c.code)}</b> <span style="color:var(--muted)">${esc(c.name)}</span></td><td class="num">${esc(c.credits)}</td><td class="num">${L||"N/A"}</td>
      <td><select data-override="${c.id}" aria-label="Letter to use for ${esc(c.code)}"><option value="">${L?`Use current (${L})`:"Not counted yet"}</option>${LETTERS.map(x=>`<option ${S.override[c.id]===x?"selected":""}>${x}</option>`).join("")}</select></td>
      <td class="num">${use?(GP[use]*k).toFixed(3):"N/A"}</td></tr>`;}).join("");
  const ceiling=(P.cr+T)?(P.pts+4*T)/(P.cr+T):null, change=(sem.cr&&sem.cum!==null&&P.gpa!==null)?sem.cum-P.gpa:null;
  document.getElementById("main").innerHTML=`
    <h1>GPA planner</h1><p class="sub">Uses your current letter in each class unless you pick a different one to test a scenario. Grade points follow Syracuse's scale (A = 4.0, A- = 3.667, B+ = 3.333, and so on).</p>
    <div class="hero">
      <div><div class="big o ${sem.gpa===null?"none":""}">${sem.gpa===null?"No grades yet":sem.gpa.toFixed(3)}</div><div class="lbl">${esc(termName())} GPA</div><div class="fine">${sem.cr} of ${T} credits counted</div></div>
      <div><div class="big ${sem.cum===null?"none":""}">${sem.cum===null?"Not yet":sem.cum.toFixed(3)}</div><div class="lbl">Cumulative GPA</div><div class="fine">${P.cr+sem.cr} credits</div></div>
      <div><div class="big ${change===null?"none":""}">${change===null?"N/A":(change>=0?"+":"")+change.toFixed(3)}</div><div class="lbl">${P.gpa===null?"Change from past GPA":`Change from ${P.gpa.toFixed(3)}`}</div></div>
    </div>
    <section class="block"><div class="bhead"><h2>This semester</h2></div>
      ${S.courses.length?`<div class="tablewrap"><table class="gpa"><thead><tr><th>Course</th><th class="num">Credits</th><th class="num">Current</th><th>Letter for GPA</th><th class="num">Grade points</th></tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td>Total</td><td class="num">${sem.cr}</td><td></td><td></td><td class="num">${sem.pts.toFixed(3)}</td></tr></tfoot></table></div>`:`<p class="sub">No courses yet.</p>`}</section>
    <section class="block twocol">
      <div class="panel"><h3>Hit a cumulative target</h3>
        <div class="ctrl" style="margin-top:10px"><label for="tcum">Cumulative GPA I want after this term</label><input type="number" inputmode="decimal" id="tcum" step="0.01" min="0" max="4" value="${esc(S.targetCum)}" placeholder="3.50"></div>
        <div class="res" id="reqout">${reqText()}</div><p>Semester GPA needed across all ${T} credits.</p></div>
      <div class="panel"><h3>Ceiling this term</h3><div class="res">${ceiling===null?"N/A":ceiling.toFixed(3)}</div><p>Your cumulative GPA if you earn an A in every class.</p></div>
    </section>
    <section class="block"><div class="bhead"><h2>Past semesters</h2><span class="sub" style="margin:0">From your transcript. Edit any time.</span></div>
      <div id="pastwrap">${pastTable()}</div></section>`;
}

/* ---------- Settings ---------- */
function renderSettings(){
  document.getElementById("main").innerHTML=`<h1>Settings</h1>
    <div class="panel" style="margin-top:20px"><h2>You</h2><div class="form">
      <label>First name<input type="text" value="${esc(S.profile.name)}" data-scope="profile" data-f="name"></label>
      <label>Current semester<input type="text" value="${esc(S.profile.term)}" data-scope="profile" data-f="term" placeholder="Fall 2026"></label></div></div>
    <div class="panel"><h2>Back up your grades</h2><p>Your grades live only in this browser. Clearing your browser data erases them, so download a backup now and then. You can also use a backup to move your grades to another device.</p>
      <div class="toolbar"><button class="btn pri" data-act="export">Download backup</button><button class="btn" data-act="importstart">Restore from backup</button></div></div>
    <div class="panel"><h2>Finish the semester</h2><p>When final grades are posted, this saves ${esc(termName())} to your past semesters using the letters in the GPA planner, then clears your courses so you can set up the next term.</p>
      <div class="toolbar"><button class="btn" data-act="finishterm">Finish ${esc(termName())}</button></div></div>
    <div class="panel"><h2>Start over</h2><p>Erase everything on this device, including past semesters.</p>
      <div class="toolbar"><button class="btn danger" data-act="resetall">Erase all data</button></div></div>
    <p class="privacy">Sophicuse is an independent student project and is not affiliated with or endorsed by Syracuse University. Grades you enter never leave your device. Projections are estimates, so always check official grades in MySlice and with your instructors.</p>`;
}

/* ---------- Render + routing ---------- */
function render(){
  renderSide();
  const V=S.view;
  if(V==="welcome") renderWelcome();
  else if(V==="overview") renderOverview();
  else if(V==="gpa") renderGPA();
  else if(V==="settings") renderSettings();
  else if(V==="new") renderNew();
  else { const c=getC(V); if(c) renderCourse(c); else { S.view="overview"; renderOverview(); } }
}
function go(v){ if(v!==S.view) S.edit=false; S.view=v; render(); window.scrollTo({top:0}); save(); }

function resizeItems(k,n){
  n=Math.max(1,Math.min(100,parseInt(n)||1));
  const base=(k.items[0]?.label||k.name||"Item").replace(/\s*\d+\s*$/,"")||"Item", max=k.items[k.items.length-1]?.max??100;
  while(k.items.length<n) k.items.push({label:`${base} ${k.items.length+1}`,earned:"",max});
  while(k.items.length>n) k.items.pop();
}
function refreshPast(){
  const P=prior(), a=document.getElementById("pastcr"), b=document.getElementById("pastgpa");
  if(a) a.textContent=P.cr||0; if(b) b.textContent=P.gpa===null?"N/A":P.gpa.toFixed(3);
  renderSide();
}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const c=getC(S.view), ci=+a.dataset.ci, ii=+a.dataset.ii;
  switch(a.dataset.act){
    case "toggleedit": S.edit=!S.edit; break;
    case "additem": { const k=c.categories[ci], last=k.items[k.items.length-1]; const base=(last?.label||"Item").replace(/\s*\d+\s*$/,"")||"Item"; k.items.push({label:`${base} ${k.items.length+1}`,earned:"",max:last?last.max:100}); break; }
    case "delitem": if(c.categories[ci].items.length<=1){ alert("A category needs at least one row. Delete the category instead."); return; } c.categories[ci].items.splice(ii,1); break;
    case "preset": c.categories.push(PRESETS[a.dataset.p]()); break;
    case "delcat": if(!confirm(`Delete "${c.categories[ci].name}" and its scores?`)) return; c.categories.splice(ci,1); break;
    case "delcourse": if(!confirm(`Delete ${c.code||"this course"} and all of its grades?`)) return;
      S.courses=S.courses.filter(x=>x.id!==c.id); delete S.override[c.id]; S.edit=false; S.view=S.courses.length?"overview":"new"; break;
    case "addpast": S.past.push({term:"",credits:"",gpa:""}); break;
    case "delpast": S.past.splice(+a.dataset.i,1); break;
    case "finishwelcome": S.onboarded=true; S.view="new"; break;
    case "createcourse": {
      const v=id=>document.getElementById("nc-"+id).value.trim();
      const err=document.getElementById("nc-err");
      if(!v("code")){ err.style.display="block"; err.textContent="Add a course code, like ECN 101."; document.getElementById("nc-code").focus(); return; }
      if(!isNum(v("credits"))){ err.style.display="block"; err.textContent="Add the number of credits."; document.getElementById("nc-credits").focus(); return; }
      const days=[...document.querySelectorAll(".nc-day:checked")].map(x=>+x.value);
      const nc=newCourse({code:v("code"),name:v("name"),credits:v("credits"),prof:v("prof"),room:v("room"),start:v("start"),end:v("end"),days});
      S.courses.push(nc); S.override[nc.id]=""; S.view=nc.id; S.edit=true; break; }
    case "export": {
      const blob=new Blob([JSON.stringify(Object.assign({},S,{edit:false}),null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob), link=document.createElement("a");
      link.href=url; link.download=`sophicuse-backup-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); return; }
    case "importstart": document.getElementById("importfile").click(); return;
    case "finishterm": {
      const sem=semester();
      if(!sem.cr){ alert("None of your courses have a letter yet. Enter grades or pick letters in the GPA planner first."); return; }
      if(!confirm(`Save ${termName()} as ${sem.cr} credits with a ${sem.gpa.toFixed(3)} GPA, then clear this semester's courses? Download a backup first if you want to keep the details.`)) return;
      S.past.push({term:termName(),credits:sem.cr,gpa:+sem.gpa.toFixed(3)}); S.courses=[]; S.override={}; S.profile.term=""; S.view="new"; break; }
    case "resetall": if(!confirm("Erase all courses, grades, and past semesters on this device? This can't be undone.")) return;
      S=freshState(); break;
  }
  render(); save();
});

document.getElementById("importfile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const s=sanitize(JSON.parse(r.result)); if(!s) throw 0;
      if(S.courses.length && !confirm("Replace everything on this device with the backup?")) return;
      S=s; S.onboarded=true; S.view="overview"; render(); save(); }
    catch(err){ alert("That file doesn't look like a Sophicuse backup."); } };
  r.readAsText(f); e.target.value="";
});

document.addEventListener("input",e=>{
  const t=e.target, sc=t.dataset.scope, f=t.dataset.f;
  if(t.id==="tcum"){ S.targetCum=t.value; document.getElementById("reqout").textContent=reqText(); save(); return; }
  if(!sc) return;
  if(sc==="profile"){ S.profile[f]=t.value; renderSide(); save(); return; }
  if(sc==="past"){ S.past[+t.dataset.i][f]=t.value; refreshPast(); save(); return; }
  const c=getC(S.view); if(!c) return;
  if(sc==="course"){
    if(f==="target") return;
    c[f]=t.value;
    if(f==="whatif"){ updateWhatif(c); save(); return; }
    if(f==="credits") refreshCourse(c); else renderSide();
    save(); return;
  }
  if(sc==="abs"){ c.absences[f]=t.value; refreshCourse(c); save(); return; }
  if(sc==="scale"){ c.scale[+t.dataset.si][1]=t.value; refreshCourse(c); save(); return; }
  if(sc==="cat"){ const k=c.categories[+t.dataset.ci];
    if(f==="kind"||f==="count"||f==="each") return;
    if(f==="keep") k.keep=t.value===""?null:Math.max(1,parseInt(t.value)||1); else k[f]=t.value;
    refreshCourse(c); save(); return; }
  if(sc==="item"){ c.categories[+t.dataset.ci].items[+t.dataset.ii][f]=t.value; refreshCourse(c); save(); return; }
});
document.addEventListener("change",e=>{
  const t=e.target, sc=t.dataset.scope, f=t.dataset.f;
  if(t.dataset.override){ S.override[t.dataset.override]=t.value; render(); save(); return; }
  const c=getC(S.view); if(!c) return;
  if(sc==="course"&&f==="target"){ c.target=t.value; refreshCourse(c); save(); return; }
  if(sc==="day"){ const d=+t.dataset.day; c.days=c.days.filter(x=>x!==d); if(t.checked) c.days.push(d); save(); return; }
  if(sc==="abstoggle"){ c.absences=t.checked?{free:2,per:5,count:""}:null; render(); save(); return; }
  if(sc==="cat"){ const k=c.categories[+t.dataset.ci];
    if(f==="kind"){ k.kind=t.value;
      if(t.value==="tally"){ if(k.earned===undefined) k.earned=""; if(k.possible===undefined) k.possible=""; if(!isNum(k.total)) k.total=100; }
      if(t.value==="items" && !Array.isArray(k.items)) k.items=one("Score");
      render(); save(); return; }
    if(f==="count"){ resizeItems(k,t.value); render(); save(); return; }
    if(f==="rank"){ render(); return; }
    if(f==="each"){ if(isNum(t.value)) k.items.forEach(it=>it.max=t.value); render(); save(); return; }
  }
  if(sc==="cat"&&f==="name"){ const h=t.closest(".cat")?.querySelector("h3"); if(h) h.textContent=t.value; }
});

/* ---------- Start ---------- */
load(); render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
