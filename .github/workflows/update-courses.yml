# Rebuilds courses.json from Syracuse's public course catalog.
# Runs automatically four times a year, or any time from the Actions tab ("Run workflow").
name: Update course list
 
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 1,4,8,11 *"   # Jan 1, Apr 1, Aug 1, Nov 1 at 12:00 UTC
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/scrape_catalog.py
      - name: Save courses.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add courses.json
          git diff --cached --quiet || git commit -m "Update course list from the Syracuse course catalog"
          git push
